name: build+tests

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: "write"
  id-token: "write"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GONOSUMDB: "github.com/ioriver/*"
      GOPRIVATE: "github.com/ioriver"
    steps:
      - name: Source code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.3"
          cache: true

      - name: Install dependencies
        if: success()
        run: |
          go get

      - name: Install golangci-lint
        if: success()
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.52.2

      - name: Lint code
        if: success()
        run: |
          golangci-lint run --fast

      - name: Build
        if: success()
        run: |
          go build ./...

      - name: Test
        if: success()
        run: |
          go test ./...

      - name: Make sweep(Terraform only)
        if: success()
        env:
          IORIVER_API_TOKEN: ${{ secrets.IORIVER_API_TOKEN }}
          IORIVER_TEST_SERVICE_ID: ${{ secrets.IORIVER_TEST_SERVICE_ID }}
          IORIVER_TEST_DOMAIN: ${{ secrets.IORIVER_TEST_DOMAIN }}
          IORIVER_TEST_CERT_ID: ${{ secrets.IORIVER_TEST_CERT_ID }}
          IORIVER_TEST_CERT_ID_2: "facfcad9-7130-4919-9a35-57af655bf7ea"
          IORIVER_TEST_CERT_ID_3: "c3b1667c-ff99-4c58-adc7-cd284fc107fd"
          IORIVER_TEST_CERT_ID_4: "f06ea5eb-2571-42fa-8518-f99bf004086e"
          IORIVER_TEST_FASTLY_API_TOKEN: ${{ secrets.IORIVER_TEST_FASTLY_API_TOKEN }}
          IORIVER_TEST_SERVICE_PROVIDER_ID: ${{ secrets.IORIVER_TEST_SERVICE_PROVIDER_ID }}
          IORIVER_TEST_DEFAULT_TRAFFIC_POLICY_ID: ${{ secrets.IORIVER_TEST_DEFAULT_TRAFFIC_POLICY_ID }}
          IORIVER_TEST_ORIGIN_ID: ${{ secrets.IORIVER_TEST_ORIGIN_ID }}
          IORIVER_TEST_DOMAIN_ID: ${{ secrets.IORIVER_TEST_DOMAIN_ID }}
          IORIVER_TEST_DEFAULT_BEHAVIOR_ID: ${{ secrets.IORIVER_TEST_DEFAULT_BEHAVIOR_ID }}
        run: |
          make sweep

      - name: Make testacc(Terraform only)
        if: success()
        env:
          IORIVER_API_TOKEN: ${{ secrets.IORIVER_API_TOKEN }}
          IORIVER_TEST_SERVICE_ID: ${{ secrets.IORIVER_TEST_SERVICE_ID }}
          IORIVER_TEST_DOMAIN: ${{ secrets.IORIVER_TEST_DOMAIN }}
          IORIVER_TEST_CERT_ID: ${{ secrets.IORIVER_TEST_CERT_ID }}
          IORIVER_TEST_CERT_ID_2: "facfcad9-7130-4919-9a35-57af655bf7ea"
          IORIVER_TEST_CERT_ID_3: "c3b1667c-ff99-4c58-adc7-cd284fc107fd"
          IORIVER_TEST_CERT_ID_4: "f06ea5eb-2571-42fa-8518-f99bf004086e"
          IORIVER_TEST_DOMAIN_1: "tf-test-1.ioriver-qa.com"
          IORIVER_TEST_DOMAIN_2: "a.tf-test-multi-cert.ioriver-qa-2.com"
          IORIVER_TEST_DOMAIN_3: "b.tf-test-multi-cert.ioriver-qa-2.com"
          IORIVER_TEST_DOMAIN_4: "*.tf-test-multi-cert.ioriver-qa-2.com"
          IORIVER_TEST_FASTLY_API_TOKEN: ${{ secrets.IORIVER_TEST_FASTLY_API_TOKEN }}
          IORIVER_TEST_SERVICE_PROVIDER_ID: ${{ secrets.IORIVER_TEST_SERVICE_PROVIDER_ID }}
          IORIVER_TEST_DEFAULT_TRAFFIC_POLICY_ID: ${{ secrets.IORIVER_TEST_DEFAULT_TRAFFIC_POLICY_ID }}
          IORIVER_TEST_ORIGIN_ID: ${{ secrets.IORIVER_TEST_ORIGIN_ID }}
          IORIVER_TEST_DOMAIN_ID: ${{ secrets.IORIVER_TEST_DOMAIN_ID }}
          IORIVER_TEST_DEFAULT_BEHAVIOR_ID: ${{ secrets.IORIVER_TEST_DEFAULT_BEHAVIOR_ID }}
        run: |
          make testacc

      - name: Versioning
        if: success()
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-bump-patch-version: false
          allow-initial-development-versions: false
          changelog-file: true
          changelog-generator-opt: "emojis=true"

      - name: Trigger Release workflow for new tag
        if: success() && steps.semrel.outputs.version != ''
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: v${{ steps.semrel.outputs.version }}
        run: |
          set -euo pipefail

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches \
            -d "{\"ref\":\"${TAG}\"}"

